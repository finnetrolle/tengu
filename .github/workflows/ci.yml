name: CI

on:
  push:
  pull_request:

jobs:
  build-and-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JDK 21 = и лаунчер Gradle, и тулчейн модулей (jvmToolchain(21)) — без скачиваний
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # нативный тулчейн Kotlin/Native (LLVM, sysroot'ы; ~1 ГБ при первом прогоне)
      - name: Cache Kotlin/Native (konan)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-kotlin-2.3.21

      - name: Build + unit tests
        run: ./gradlew build

      # кросс-компиляция Windows-бинарника из Linux (артефакт для машин агентов на Win)
      - name: Cross-compile Windows binary
        run: ./gradlew :cli:linkReleaseExecutableMingwX64

      - name: E2E (S1-S8, нативный linuxX64-бинарник)
        run: bash scripts/e2e.sh

      - name: Upload native binaries
        uses: actions/upload-artifact@v4
        with:
          name: tengu-native
          if-no-files-found: error
          path: |
            cli/build/bin/linuxX64/releaseExecutable/tengu.kexe
            cli/build/bin/mingwX64/releaseExecutable/tengu.exe
